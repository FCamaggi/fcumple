# Configuracion de Supabase para la Fase 1 (multi-tenant). En el corte, este
# archivo reemplaza a supabase/config.toml; ver
# docs/fase-1-mvp-multitenant/arquitectura-multitenant.md.
#
# Igual que en la Fase 0, project_id queda en blanco a proposito: el deploy lo
# completa con SUPABASE_PROJECT_ID.
project_id = ""

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Los ORGANIZADORES crean su propia cuenta (correo y contrasena). Los
# invitados NO usan Supabase Auth: entran con nombre + PIN mediante las RPC
# register_guest / login_guest.
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
# Recomendado en produccion: evita cuentas con correos ajenos o falsos.
enable_confirmations = true
